{% extends "base.html" %}

{% block title %}Serverfout (500){% endblock %}

{% block content %}
<div class="card error-page">
    <div class="error-code" style="color: var(--danger);">500</div>
    <h1 class="error-title">Er ging iets mis</h1>
    <p class="error-desc">
        Er is een interne serverfout opgetreden. Probeer het over een ogenblik nog eens.
    </p>
    <div>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            &larr; Terug naar de agenda
        </a>
    </div>
</div>
{% endblock %}
